name: CI

on:
  push:
    branches: [main, 5.4.8, coa]
    tags: ['v548-*', 'vcoa-*']
  pull_request:
    branches: [main, 5.4.8, coa]
  workflow_dispatch:

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest

    # Needed by the tag-triggered release step; without it the default
    # GITHUB_TOKEN is read-only and creating the release 403s.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore SpellWork.sln --nologo

      - name: Build
        run: dotnet build SpellWork.sln -c $env:CONFIGURATION --no-restore --nologo

      # --no-build so the tests run against exactly the binaries produced
      # above rather than triggering a second, SDK-only rebuild.
      - name: Test
        run: dotnet test SpellWork.sln -c $env:CONFIGURATION --no-build --nologo --logger "trx;LogFileName=results.trx"

      # Tests that need real client DBC/DB2 data skip themselves when no data
      # is present, which is always the case on CI -- client data is not
      # redistributable and is not in this repo. Keeping the trx means the
      # pass/skip split stays inspectable instead of collapsing to "green".
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Package SpellWork.Mcp
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          dotnet publish SpellWork.Mcp\SpellWork.Mcp.csproj -c $env:CONFIGURATION -o mcp-publish --nologo
          Compress-Archive -Path mcp-publish\* -DestinationPath dist\SpellWork.Mcp-coa.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SpellWork.Mcp-coa
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/vcoa-')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          # The "Latest" badge belongs to main's desktop releases (v*), whose
          # README links to it; a vcoa-* release must never take it.
          make_latest: false
          body: |
            ### Downloads

            | Archive | What it is | Needs |
            | --- | --- | --- |
            | `SpellWork.Mcp-coa.zip` | The read-only MCP server for AI agents | .NET 9 runtime |

            This build parses **CoA 3.3.5a (12340)** DBC data. Client data is not
            included and is not redistributable — point `SPELLWORK_DBC_PATH` at your
            CoA client `dbc` folder (for a CoA server checkout:
            `<azerothcore-wotlk-coa>/env/dist/data/dbc`). There is no `db2` folder
            for this build.

            Register with Claude Code: [README — Register with Claude Code](https://github.com/HavenWoW/SpellWork/blob/coa/README.md#register-with-claude-code)

            Configuration and tool reference: [docs/mcp-server.md](https://github.com/HavenWoW/SpellWork/blob/coa/docs/mcp-server.md)
